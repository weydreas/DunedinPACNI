name: MRI launcher regression
on:
  pull_request:
  push:
    branches: [master]
jobs:
  portable-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MRI discovery and QC tests (no patient data)
        run: python -m unittest discover -s tests -v
      - name: Parse Windows PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './start.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Parse launcher with legacy Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './start.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
  r-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      - name: Install model dependency
        run: Rscript -e "install.packages('progress', repos='https://cloud.r-project.org')"
      - name: Test published PACNI model without patient data
        run: Rscript tests/test_export_r.R

  synthsr-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated CPU SynthSR image and download the pinned research model
        run: docker build --progress plain -f docker/Dockerfile.synthsr -t biodata-synthsr:ci .
      - name: Verify model and command line without patient data
        run: |
          docker run --rm --network none biodata-synthsr:ci --help
          docker run --rm --network none --entrypoint python biodata-synthsr:ci -c "from pathlib import Path; import tensorflow as tf; p=Path('/opt/py_synthsr/py_synthsr/models/synthsr_v20_230130.h5'); assert p.is_file() and p.stat().st_size > 1000000; print('SynthSR model ready; TensorFlow:', tf.__version__)"
      - name: Print SHA-256 of the external SynthSR v2 model for provenance pinning
        run: docker run --rm --network none --entrypoint sha256sum biodata-synthsr:ci /opt/py_synthsr/py_synthsr/models/synthsr_v20_230130.h5
      - name: Run actual CPU SynthSR inference on a generated nonclinical phantom
        run: |
          mkdir -p "$RUNNER_TEMP/synthsr-smoke"
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/synthsr-smoke,target=/data" --entrypoint python biodata-synthsr:ci -c "import nibabel as nib, numpy as np; x,y,z=np.ogrid[:192,:192,:192]; r=((x-96)**2+(y-96)**2+(z-96)**2)**0.5; a=np.where(r<75, 150-r, 0).astype('float32'); nib.save(nib.Nifti1Image(a,np.eye(4)), '/data/input.nii.gz')"
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/synthsr-smoke,target=/data" biodata-synthsr:ci --i /data/input.nii.gz --o /data/output.nii.gz --disable_flipping --cpu --threads 2
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/synthsr-smoke,target=/data,readonly" --entrypoint python biodata-synthsr:ci -c "import nibabel as nib, numpy as np; img=nib.load('/data/output.nii.gz'); assert img.ndim == 3; assert all(.9 < p < 1.1 for p in img.header.get_zooms()[:3]); assert np.isfinite(img.dataobj).all(); print('Actual SynthSR CPU inference completed on nonclinical generated phantom:', img.shape)"
