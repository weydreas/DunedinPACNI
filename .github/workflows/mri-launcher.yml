name: MRI launcher regression
on:
  pull_request:
  push:
    branches: [master]
jobs:
  portable-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MRI discovery and QC tests (no patient data)
        run: python -m unittest discover -s tests -v
